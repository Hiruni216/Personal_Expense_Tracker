<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Personal Expense Tracker</title>

    <link rel="stylesheet" href="styles.css">
    <script src="scripts.js" defer></script>
</head>

<body>

    <nav class="navbar">
        <h1>Personal Expense Tracker</h1>
    </nav>

    <main class="container">

        <!-- Summary Cards -->
        <section class="summary">
            <div class="card income-card">
                <h3>Total Income</h3>
                <p id="totalIncome">LKR 0.00</p>
            </div>

            <div class="card expense-card">
                <h3>Total Expenses</h3>
                <p id="totalExpenses">LKR 0.00</p>
            </div>

            <div class="card balance-card">
                <h3>Current Balance</h3>
                <p id="currentBalance">LKR 0.00</p>
            </div>
        </section>

        <!-- Transaction Form -->
        <section class="form-section">
            <h2>Add Transaction</h2>

            <form id="transactionForm">

                <div class="form-group">
                    <label for="type">Transaction Type</label>
                    <select id="type" required>
                        <option value="">Select Type</option>
                        <option value="Income">Income</option>
                        <option value="Expense">Expense</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <input
                        type="text"
                        id="description"
                        placeholder="Enter description"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="amount">Amount (LKR)</label>
                    <input
                        type="number"
                        id="amount"
                        placeholder="Enter amount"
                        min="0.01"
                        step="0.01"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" required>
                        <option value="">Select Category</option>
                        <option value="Allowance">Allowance</option>
                        <option value="Salary">Salary</option>
                        <option value="Food">Food</option>
                        <option value="Transport">Transport</option>
                        <option value="Education">Education</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Bills">Bills</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" required>
                </div>

                <div class="form-buttons">
                    <button type="submit" class="add-btn">
                        Add Transaction
                    </button>

                    <button type="reset" class="clear-btn">
                        Clear Form
                    </button>
                </div>

            </form>
        </section>

        <!-- Transaction History -->
        <section class="history-section">
            <div class="history-header">
                <h2>Transaction History</h2>

                <div class="filter-group">
                    <label for="filter">Filter:</label>
                    <select id="filter">
                        <option value="All">All Transactions</option>
                        <option value="Income">Income Only</option>
                        <option value="Expense">Expenses Only</option>
                    </select>
                </div>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Description</th>
                            <th>Type</th>
                            <th>Category</th>
                            <th>Amount (LKR)</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="transactionTable">
                        <!-- Transactions are added by JavaScript -->
                    </tbody>
                </table>
            </div>

            <p id="emptyMessage" class="empty-message">
                No transactions added yet.
            </p>
        </section>

    </main>

    <footer>
        <p>Personal Expense Tracker &copy; 2026</p>
    </footer>

</body>
</html>
